[package]
name = "hotelops-ai-desktop"
version = "0.1.0"
edition = "2024"
authors = ["HotelOps AI Team"]

[lib]
name = "hotelops_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
