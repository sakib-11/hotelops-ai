[alembic]
script_location = database/migrations
# Make the repo root importable (backend.* packages) so the alembic CLI
# works from the repository root without PYTHONPATH.
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is resolved by migrations/env.py from the project's
# single configuration system (precedence): an explicit value here or
# one set via set_main_option, then $DATABASE_URL, then Settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
