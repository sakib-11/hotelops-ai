[alembic]
script_location = database/migrations
# sqlalchemy.url is set programmatically in env.py to support
# async driver and per-environment configuration.
sqlalchemy.url = postgresql+asyncpg://hotelops:CHANGE_ME@localhost:5433/hotelops

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
