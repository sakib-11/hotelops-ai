[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotelops-ai"
version = "0.1.0"
description = "HotelOps AI — Operational intelligence platform for hospitality"
requires-python = ">=3.14"
authors = [
    { name = "HotelOps AI Team" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "boto3>=1.36.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "pyjwt>=2.9.0",
    # Task 8 — observability foundation (all optional at runtime; see
    # OBSERVABILITY_* settings). Structured JSON logging uses only the
    # stdlib logging + json modules (no dependency required).
    # Metrics: Prometheus client library — pure Python, no external
    # server required to start; /metrics exposition is Task 8.3+.
    "prometheus-client>=0.21.0",
    # OpenTelemetry tracing API + SDK. The API is a safe no-op until an
    # SDK/exporter is initialized; the app never contacts an OTLP
    # endpoint unless OBSERVABILITY_TRACING_ENABLED=true (default off),
    # so no external telemetry server is required to start.
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    # OTLP/HTTP exporter for OpenTelemetry tracing (Task 8.7). Imported
    # LAZILY only when OBSERVABILITY_TRACING_ENABLED=true — the app never
    # contacts the endpoint while disabled, and startup does not require
    # a collector to be running.
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.optional-dependencies]
# Deterministic CV runtime (Task 12 detectors + Task 13 tracker). These are
# the packages the yolo/bytetrack adapters refer to as the "cv" extras.
# They are ALWAYS lazily imported behind the provider boundaries and NEVER
# required for the core application to start or run — the adapters raise a
# typed, actionable error when they are missing.
cv = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "ultralytics>=8.2.0",
    "bytetrack>=0.1.0",
]

# =============================================================================
# Ruff — Linter & Formatter
# =============================================================================
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific
]
ignore = [
    "line-too-long", # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["invalid-function-name", "invalid-argument-name", "non-lowercase-variable-in-function", "unused-async"]
"backend/app/api/**" = ["function-call-in-default-argument"]  # FastAPI Depends() is not a side-effect default
"backend/app/domain/configuration/validation/validators.py" = ["unused-async"]  # uniform async interface for VALIDATOR_STAGES orchestration
"backend/app/infrastructure/auth/deps.py" = ["function-call-in-default-argument", "unused-async"]  # FastAPI Depends() standard pattern; async needed for future DB lookup
"backend/app/infrastructure/auth/handler.py" = ["unused-async"]  # FastAPI exception handlers must be async
"backend/app/main.py" = ["raise-without-from-inside-except", "fallible-context-manager"]  # lifespan pattern is correct for FastAPI
"backend/app/api/routes/health.py" = ["function-call-in-default-argument"]  # FastAPI Depends() standard pattern

[tool.ruff.lint.isort]
known-first-party = ["hotelops"]

# =============================================================================
# mypy — Static Type Checking
# =============================================================================
[tool.mypy]
strict = true
python_version = "3.14"
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = false

[[tool.mypy.overrides]]
module = "backend.app.api.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "backend.app.main"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# =============================================================================
# pytest — Test Runner
# =============================================================================
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
strict_markers = true
markers = [
    "unit: Fast isolated unit tests",
    "contract: API/event/schema compatibility tests",
    "integration: Database/Redis/storage integration tests",
    "cv_regression: Video/cv regression tests",
    "e2e: Full end-to-end workflow tests",
    "security: Authorization/privacy/security tests",
    "performance: Throughput/load/capacity tests",
    "asyncio: async test marker for pytest-asyncio",
]

asyncio_mode = "auto"

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
